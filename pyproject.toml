[project]
name = "space-cadet"
version = "0.1.0"
description = "Data pipeline combining space weather, satcat, and decay datasets to predict space junk reentry timing"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
]

[dependency-groups]
api = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "modal>=1.6.4",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "scikit-learn==1.7.2",
    "uvicorn>=0.54.0",
]
